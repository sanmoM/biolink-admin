<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madwess Navbar</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body class="bg-[#000000]">
    <nav
        class="sticky top-0 z-50 flex items-center bg-black justify-between px-6 py-2 bg-[#18191d] border-b border-[#EAB308]/20">

        <!-- Left: Logo -->
        <div class="flex items-center gap-4">
            <img src="assets/logo.png" alt="Madwess Logo" class="h-12 w-auto">
        </div>

        <!-- Center: Search -->
        <div class="hidden sm:flex flex-1 max-w-[500px] mx-auto">
            <div class="relative w-full">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                <input type="text" placeholder="Search links, QR codes, analytics..."
                    class="w-full pl-10 pr-4 py-2 bg-white/5 border border-[#9CA3AF]/20 rounded-md text-sm text-[#9CA3AF] font-medium placeholder-gray-500 focus:outline-none focus:border-gray-500 focus:bg-[#14151a] transition" />
            </div>
        </div>

        <!-- Right: Notification + Profile -->
        <div class="flex items-center gap-4">

            <!-- Notification -->
            <div
                class="relative w-9 h-9 flex items-center justify-center rounded-lg cursor-pointer hover:bg-[#1a1b20] transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24">
                    <path fill="white" d="M20 17h2v2H2v-2h2v-7a8 8 0 1 1 16 0zm-2 0v-7a6 6 0 0 0-12 0v7zm-9 4h6v2H9z" />
                </svg> <span
                    class="absolute top-1 right-1 w-3 h-3 bg-yellow-400 rounded-full border-2 border-[#18191d]"></span>
            </div>

            <!-- Profile -->
            <div
                class="w-8 h-8 flex items-center justify-center rounded-full bg-gradient-to-br from-[#FACC15] to-[#3B82F6] text-sm font-bold text-black cursor-pointer hover:scale-105 transition">
                JD
            </div>

        </div>
    </nav>

</body>

</html>
